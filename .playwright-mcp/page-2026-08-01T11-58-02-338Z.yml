      - generic [ref=f7e196]: Why Monad
      - heading "Checking every payment only works where blocks are fast and cheap" [level=2] [ref=f7e197]
      - paragraph [ref=f7e198]: Every payment runs verify, then hold, then release, then settle. Monad's speed and near zero fees make a real time check usable, and make sub cent payments real instead of gas eaten. Built on x402 and ERC-8004, the open agent payment standards.

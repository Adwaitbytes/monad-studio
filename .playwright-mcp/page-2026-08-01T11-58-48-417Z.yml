      - generic [ref=f9e202]: Why Monad
      - heading "Checking every payment only works where blocks are fast and cheap" [level=2] [ref=f9e203]
      - paragraph [ref=f9e204]: Every payment runs verify, then hold, then release, then settle. Monad's speed and near zero fees make a real time check usable, and make sub cent payments real instead of gas eaten. Built on x402 and ERC-8004, the open agent payment standards.

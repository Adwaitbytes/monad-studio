    - generic [ref=f19e189]:
      - paragraph [ref=f19e190]: Why Monad
      - heading "A real-time check only works where blocks are fast and cheap" [level=2] [ref=f19e191]
      - paragraph [ref=f19e192]: Every payment runs verify, then hold, then release, then settle. Monad's speed and near zero fees make a live check usable, and make sub-cent payments real instead of gas eaten. Built on x402 and ERC-8004, the open agent payment standards.
